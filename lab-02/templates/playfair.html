<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mật mã Playfair - BMTT Nâng Cao</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .matrix-container {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }
        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(5, 50px);
            gap: 8px;
            margin-top: 1rem;
        }
        .matrix-cell {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(147, 51, 234, 0.1);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.3s;
        }
        .matrix-cell:hover {
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">
            <span>🛡️</span> BMTT Nâng Cao
        </a>
        <nav class="nav-links">
            <a href="/" class="nav-item">Dashboard</a>
            <a href="/caesar" class="nav-item">Caesar</a>
            <a href="/vigenere" class="nav-item">Vigenère</a>
            <a href="/railfence" class="nav-item">Rail Fence</a>
            <a href="/playfair" class="nav-item active">Playfair</a>
            <a href="/transposition" class="nav-item">Transposition</a>
        </nav>
    </header>

    <main>
        <div class="card">
            <h1>Mật mã Playfair</h1>
            <p class="subtitle">Mật mã cặp chữ cái dựa trên bảng ma trận kích thước 5x5 xây dựng từ khoá bí mật.</p>
            
            <div class="cipher-grid">
                <div class="input-section">
                    <div class="form-group">
                        <label for="text-input">Văn bản cần xử lý</label>
                        <textarea id="text-input" placeholder="Nhập văn bản tại đây..."></textarea>
                    </div>
                    
                    <div class="form-group" style="display: flex; gap: 1rem; align-items: flex-end;">
                        <div style="flex: 1;">
                            <label for="key-input">Từ khoá bí mật (Key)</label>
                            <input type="text" id="key-input" value="MONARCHY" placeholder="Nhập từ khoá chữ cái...">
                        </div>
                        <button class="btn btn-secondary" onclick="generateMatrix()" style="padding: 1rem 1.5rem; height: 50px;">🔧 Tạo ma trận</button>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="processCipher('encrypt')">🔒 Mã hoá</button>
                        <button class="btn btn-secondary" onclick="processCipher('decrypt')">🔑 Giải mã</button>
                    </div>
                </div>
                
                <div class="output-section">
                    <div class="matrix-container" id="matrix-container" style="display: none;">
                        <label>Ma trận khóa 5x5 (Thay J bằng I)</label>
                        <div class="matrix-grid" id="matrix-grid"></div>
                    </div>

                    <div class="result-card">
                        <div class="result-header">
                            <span class="result-title" id="result-title">Kết quả</span>
                            <button class="copy-btn" onclick="copyResult()">📋 Sao chép</button>
                        </div>
                        <div class="result-box" id="result-box">Kết quả sẽ xuất hiện ở đây...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 HUTECH Advanced Cryptography Lab - Thiết kế bởi Antigravity</p>
    </footer>

    <script>
        async function generateMatrix() {
            const keyInput = document.getElementById("key-input").value;
            const matrixGrid = document.getElementById("matrix-grid");
            const matrixContainer = document.getElementById("matrix-container");
            
            if (!keyInput.trim()) {
                alert("Vui lòng nhập từ khoá!");
                return;
            }
            
            try {
                const response = await fetch('http://127.0.0.1:5000/api/playfair/creatematrix', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ key: keyInput })
                });
                
                if (!response.ok) {
                    throw new Error("Có lỗi xảy ra từ máy chủ API");
                }
                
                const data = await response.json();
                const matrix = data.matrix || data.playfair_matrix;
                
                matrixGrid.innerHTML = '';
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        const cell = document.createElement("div");
                        cell.className = "matrix-cell";
                        cell.innerText = matrix[r][c];
                        matrixGrid.appendChild(cell);
                    }
                }
                matrixContainer.style.display = "flex";
            } catch (err) {
                alert(`Lỗi: ${err.message}. Hãy chắc chắn rằng API server ở cổng 5000 đang chạy!`);
            }
        }

        async function processCipher(action) {
            const textInput = document.getElementById("text-input").value;
            const keyInput = document.getElementById("key-input").value;
            const resultBox = document.getElementById("result-box");
            const resultTitle = document.getElementById("result-title");
            
            if (!textInput.trim() || !keyInput.trim()) {
                alert("Vui lòng nhập văn bản và từ khoá!");
                return;
            }
            
            resultBox.innerText = "Đang xử lý...";
            
            try {
                const endpoint = action === 'encrypt' ? '/api/playfair/encrypt' : '/api/playfair/decrypt';
                const bodyData = action === 'encrypt' 
                    ? { plain_text: textInput, key: keyInput }
                    : { cipher_text: textInput, key: keyInput };
                
                const response = await fetch(`http://127.0.0.1:5000${endpoint}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bodyData)
                });
                
                if (!response.ok) {
                    throw new Error("Có lỗi xảy ra từ máy chủ API");
                }
                
                const data = await response.json();
                const result = action === 'encrypt' ? data.encrypted_message : data.decrypted_message;
                
                resultTitle.innerText = action === 'encrypt' ? "Bản mã (Ciphertext)" : "Bản rõ (Plaintext)";
                resultBox.innerText = result;
                
                // Automatically generate and show matrix on encrypt/decrypt as well
                generateMatrix();
            } catch (err) {
                resultBox.innerText = `Lỗi: ${err.message}. Hãy chắc chắn rằng API server ở cổng 5000 đang chạy!`;
            }
        }
        
        function copyResult() {
            const resultBox = document.getElementById("result-box");
            if (resultBox.innerText && !resultBox.innerText.startsWith("Kết quả") && !resultBox.innerText.startsWith("Lỗi")) {
                navigator.clipboard.writeText(resultBox.innerText);
                alert("Đã sao chép vào bộ nhớ tạm!");
            }
        }
        
        // Generate matrix on load
        window.onload = generateMatrix;
    </script>
</body>
</html>
